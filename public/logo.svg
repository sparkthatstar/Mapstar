<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Rich Furniture Brown Gradient Background -->
    <linearGradient id="mapstar-brown-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854D0E" />
      <stop offset="35%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Warm Amber Gold Gradient for Necklace Chain & Pin Trim -->
    <linearGradient id="mapstar-gold-chain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Furniture Brown Gradient for Location Pendant -->
    <linearGradient id="mapstar-pendant-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854D0E" />
      <stop offset="100%" stop-color="#5C2607" />
    </linearGradient>

    <!-- Soft Ambient Shadow for White Star -->
    <filter id="star-soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#241002" flood-opacity="0.55" />
    </filter>

    <!-- Drop Shadow for Location Pendant on the Star -->
    <filter id="pendant-drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="0.8" flood-color="#3D1804" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Brown Background: Furniture Brown Rounded Squircle Shield -->
  <rect width="64" height="64" rx="15" fill="url(#mapstar-brown-bg)" />
  <!-- Delicate Warm Amber Rim Accent -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.5" fill="none" />

  <!-- 2. Pure White Star -->
  <g filter="url(#star-soft-shadow)">
    <path
      d="M 32 9.5
         L 38.2 25.5
         L 54.8 26.5
         L 42.0 37.0
         L 46.0 53.0
         L 32 44.0
         L 18.0 53.0
         L 22.0 37.0
         L 9.2 26.5
         L 25.8 25.5 Z"
      fill="#FFFFFF"
      stroke="#FAF7F2"
      stroke-width="0.5"
      stroke-linejoin="round"
    />
  </g>

  <!-- 3. Necklace: Draped Around the Star's Head (Neck) -->
  <path
    d="M 24.5 24.2 C 26.8 32.2, 37.2 32.2, 39.5 24.2"
    fill="none"
    stroke="url(#mapstar-gold-chain)"
    stroke-width="2.2"
    stroke-linecap="round"
  />
  <!-- Necklace Jewel Beads -->
  <circle cx="26.2" cy="26.8" r="1.1" fill="#FEF08A" />
  <circle cx="37.8" cy="26.8" r="1.1" fill="#FEF08A" />
  <!-- Pendant Bail Ring -->
  <circle cx="32" cy="29.2" r="1.5" fill="none" stroke="url(#mapstar-gold-chain)" stroke-width="1.3" />

  <!-- 4. Location Sign (Map Pin) Worn as a Necklace Pendant -->
  <g filter="url(#pendant-drop-shadow)">
    <!-- Location Pin Body (Teardrop pointer resting in star center) -->
    <path
      d="M 32 44.0
         L 26.8 36.2
         A 6.0 6.0 0 1 1 37.2 36.2
         Z"
      fill="url(#mapstar-pendant-fill)"
      stroke="url(#mapstar-gold-chain)"
      stroke-width="1.4"
      stroke-linejoin="round"
    />
    <!-- Location Pin Inner Circle (White Accent Hole) -->
    <circle cx="32" cy="33.8" r="2.2" fill="#FFFFFF" />
  </g>
</svg>